services:
  postgres:
    image: postgres:16-alpine
    container_name: mokuro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mokuro_enhanced
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mokuro-network

  redis:
    image: redis:7-alpine
    container_name: mokuro-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mokuro-network

  server:
    build:
      context: ./packages
      dockerfile: server/Dockerfile
    container_name: mokuro-server
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: mokuro_enhanced
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 7d
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: /data/uploads
      # S3 configuration (optional)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      # CORS configuration
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '3000:3000'
    volumes:
      - ./packages/server/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mokuro-network
    restart: unless-stopped

  worker:
    build:
      context: ./packages/worker
      dockerfile: Dockerfile
    container_name: mokuro-worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMP_DIR: /data/temp
      BACKEND_URL: http://server:3000
      MOKURO_MODEL: kha-white/manga-ocr-base
      FORCE_CPU: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Worker only needs its own temp directory for processing
      - worker_temp:/data/temp
    depends_on:
      - redis
      - server
    networks:
      - mokuro-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  server_uploads:
  worker_temp:

networks:
  mokuro-network:
    driver: bridge